<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#050508"/>
  <!-- Stars -->
  <circle cx="8" cy="6" r="0.8" fill="#fff" opacity="0.6"/>
  <circle cx="24" cy="10" r="0.6" fill="#fff" opacity="0.4"/>
  <circle cx="6" cy="22" r="0.5" fill="#fff" opacity="0.5"/>
  <circle cx="27" cy="25" r="0.7" fill="#fff" opacity="0.3"/>
  <!-- Black hole -->
  <circle cx="16" cy="17" r="7" fill="#000" opacity="0.9"/>
  <!-- Accretion disk glow -->
  <ellipse cx="16" cy="17" rx="11" ry="4" fill="none" stroke="#00b8e6" stroke-width="0.8" opacity="0.4" transform="rotate(-20, 16, 17)"/>
  <ellipse cx="16" cy="17" rx="9" ry="3" fill="none" stroke="#7b2ff7" stroke-width="0.5" opacity="0.3" transform="rotate(-20, 16, 17)"/>
  <!-- Photon ring -->
  <circle cx="16" cy="17" r="5.5" fill="none" stroke="#f0c040" stroke-width="0.5" opacity="0.3"/>
  <circle cx="16" cy="17" r="6.5" fill="none" stroke="#00b8e6" stroke-width="0.3" opacity="0.15"/>
  <!-- Center glow -->
  <circle cx="16" cy="17" r="2" fill="#000"/>
</svg>
